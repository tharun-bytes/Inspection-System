name: CI

on:
  push:
    branches: [main, ai, backend, frontend, integration, testing, demo]
  pull_request:
    branches: [ai, backend, frontend, integration, testing, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each component branch only carries its own directory, so a job for a service
# that is not on this branch detects that and reports success rather than
# failing on a missing working directory. Every job still reports on every
# branch, which is what lets the branch protection rules require these checks
# by name without a PR hanging forever on a check that never runs.
#
# Note: `hashFiles()` is NOT available in a job-level `if`, only in a step-level
# one, so detection happens in a step. Keep this file valid -- an invalid
# workflow is rejected wholesale and no job runs at all.

jobs:
  ai:
    name: AI service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect ai/
        id: detect
        run: |
          if [ -f ai/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Not on this branch
        if: steps.detect.outputs.present != 'true'
        run: echo "ai/ is not present on ${{ github.ref_name }}, nothing to check."
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: ai
        run: pip install -r requirements.txt
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: ai
        run: ruff check .
      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: ai
        run: pytest -q

  backend:
    name: Backend API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect backend/
        id: detect
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Not on this branch
        if: steps.detect.outputs.present != 'true'
        run: echo "backend/ is not present on ${{ github.ref_name }}, nothing to check."
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: ruff check .
      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend/
        id: detect
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Not on this branch
        if: steps.detect.outputs.present != 'true'
        run: echo "frontend/ is not present on ${{ github.ref_name }}, nothing to check."
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint
      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm test
      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build

  integration:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [ai, backend, frontend]
    # `github.ref_name` is the short branch name, not 'refs/heads/<name>'.
    # The component jobs above never get skipped, so `needs` is safe here.
    if: github.event_name == 'pull_request' || github.ref_name == 'integration' || github.ref_name == 'testing' || github.ref_name == 'demo' || github.ref_name == 'main'
    defaults:
      run:
        working-directory: integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: integration/requirements.txt
      - run: pip install -r requirements.txt
      - name: Boot the full stack
        run: docker compose -f docker-compose.yml up -d --build --wait
      - name: End-to-end tests
        run: pytest
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v
