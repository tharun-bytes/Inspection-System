name: CI

on:
  push:
    branches: [main, ai, backend, frontend, integration, testing, demo]
  pull_request:
    branches: [ai, backend, frontend, integration, testing, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai:
    name: AI service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  backend:
    name: Backend API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  integration:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [ai, backend, frontend]
    if: github.ref_name == 'refs/heads/integration' || github.ref_name == 'refs/heads/testing' || github.ref_name == 'refs/heads/demo' || github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: integration/requirements.txt
      - run: pip install -r requirements.txt
      - name: Boot the full stack
        run: docker compose -f docker-compose.yml up -d --build --wait
      - name: End-to-end tests
        run: pytest
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v
