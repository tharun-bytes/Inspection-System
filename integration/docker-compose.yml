services:
  ai:
    build:
      context: ../ai
    container_name: inspection-ai
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ../backend
    container_name: inspection-backend
    environment:
      INSPECTION_AI_SERVICE_URL: http://ai:8001
      INSPECTION_DATABASE_URL: sqlite:////data/inspection.db
      INSPECTION_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - inspection-data:/data
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: inspection-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  inspection-data:
